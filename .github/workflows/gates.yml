# ruff and the suite on every push, on Linux and Windows. Until this job the suite only
# ever ran on one Windows desk with NVENC and Edge, so nothing proved it ran elsewhere.
#
# Tests marked `full` encode minutes of video. They skip on a push and run in the
# nightly job, where URDIDO_FULL=1. The gate names every skipped test in the summary,
# so a green run never claims more than it ran.
name: gates

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  python:
    name: ruff and pytest, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      URDIDO_FULL: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install
        run: python -m pip install -e ".[test,cards]"
      - name: Playwright's Chromium
        run: python -m playwright install --with-deps chromium
      - name: ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: pytest, through the gate
        shell: bash
        run: python tools/gate.py | tee gate-summary.txt; exit ${PIPESTATUS[0]}
      - name: which tests failed
        if: failure()
        shell: bash
        run: grep -E "^(FAILED|ERROR) " .urdido/gate/pytest.log || tail -40 .urdido/gate/pytest.log
      - name: what this run proved
        if: always()
        shell: bash
        run: |
          {
            echo "### Gate, ${{ matrix.os }}, Python ${{ matrix.python }}"
            echo
            echo '```'
            cat gate-summary.txt 2>/dev/null || echo "the gate did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
